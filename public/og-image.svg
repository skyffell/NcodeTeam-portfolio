<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="50%" stop-color="#12151f"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Неоновые сферы на фоне -->
  <circle cx="200" cy="150" r="180" fill="#00d4ff" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />

  <!-- Сетка -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Бейдж команды -->
  <rect x="475" y="130" width="250" height="42" rx="21" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1" />
  <text x="600" y="157" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="16" font-weight="600" fill="#00d4ff" text-anchor="middle" letter-spacing="3">DIGITAL AGENCY</text>

  <!-- Главный логотип / Заголовок -->
  <text x="600" y="270" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="82" font-weight="800" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="4">N-CODE TEAM</text>

  <!-- Подзаголовок -->
  <text x="600" y="340" font-family="'Inter', sans-serif" font-size="28" font-weight="500" fill="#f1f5f9" text-anchor="middle">Fullstack веб-разработка под ключ</text>
  <text x="600" y="385" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="middle">От идеи и дизайна до высоконагруженных API и продакшена</text>

  <!-- Стек технологий (бейджи) -->
  <g transform="translate(300, 450)">
    <rect x="0" y="0" width="130" height="42" rx="10" fill="rgba(0, 212, 255, 0.1)" stroke="#00d4ff" stroke-width="1" />
    <text x="65" y="26" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#00d4ff" text-anchor="middle">React / UI</text>

    <rect x="155" y="0" width="130" height="42" rx="10" fill="rgba(139, 92, 246, 0.1)" stroke="#8b5cf6" stroke-width="1" />
    <text x="220" y="26" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#8b5cf6" text-anchor="middle">Python / API</text>

    <rect x="310" y="0" width="140" height="42" rx="10" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1" />
    <text x="380" y="26" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#10b981" text-anchor="middle">PostgreSQL</text>

    <rect x="475" y="0" width="125" height="42" rx="10" fill="rgba(255, 107, 53, 0.1)" stroke="#ff6b35" stroke-width="1" />
    <text x="537" y="26" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#ff6b35" text-anchor="middle">FastAPI</text>
  </g>
</svg>
